name: جلب تصنيفات ومواد IslamHouse
on:
  push:
    branches: [dev]
    paths: [scripts/ih-index.py, scripts/ih-classify.py, .github/workflows/fetch-ih.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ih-index.py && python3 scripts/ih-classify.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/src data || true
          git diff --cached --quiet || git commit -m "بيانات IslamHouse"
          git push
