name: بحث عن تسجيل أذان بترخيص حر
on:
  push:
    branches: [dev]
    paths: [.github/workflows/probe-radio.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "adhan" "azan" "athan" "أذان" "call to prayer"; do
            echo "##### $q"
            curl -s -G "https://commons.wikimedia.org/w/api.php" -A "AtharApp/1.0 (educational)" \
              --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "generator=search" \
              --data-urlencode "gsrnamespace=6" --data-urlencode "gsrsearch=$q filetype:audio" --data-urlencode "gsrlimit=30" \
              --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|size|mime|extmetadata" \
              --data-urlencode "iiextmetadatafilter=LicenseShortName|Artist" \
            | jq -r '.query.pages[]? | [.title, .imageinfo[0].mime, (.imageinfo[0].size|tostring), (.imageinfo[0].extmetadata.LicenseShortName.value // "?"), ((.imageinfo[0].extmetadata.Artist.value // "")|gsub("<[^>]+>";"")|.[0:40]), .imageinfo[0].url] | join(" | ")'
          done
