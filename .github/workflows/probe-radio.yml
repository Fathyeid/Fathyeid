name: فحص روابط الإذاعة
on:
  push:
    branches: [dev]
    paths: [.github/workflows/probe-radio.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          L=$(curl -s -o /dev/null -w '%{redirect_url}' https://stream.radiojar.com/0tpy1h0kxtzuv); echo "redir: $L"
          H=$(echo "$L" | sed 's#^http://#https://#'); echo "=== $H"
          curl -sS -D - -o /tmp/b --max-time 5 "$H" -A "$A" 2>&1 | grep -iE '^(HTTP|location|content-type|curl)' || true
          for u in https://n03.radiojar.com/0tpy1h0kxtzuv https://stream.radiojar.com/0tpy1h0kxtzuv?https=1 https://qurango.net/radio/ibrahim_alakdar https://qurango.net/radio/tarateel; do
            echo "=== $u"; curl -sS -D - -o /tmp/b --max-time 4 "$u" -A "$A" 2>&1 | grep -iE '^(HTTP|location|content-type|curl)' || true
          done
