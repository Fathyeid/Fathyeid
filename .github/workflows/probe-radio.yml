name: فحص روابط الإذاعة
on:
  push:
    branches: [dev]
    paths: [.github/workflows/probe-radio.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          echo "=== radiojar 8s5u5tpdtwzuv"; curl -sS -D - -o /tmp/b --max-time 5 -L https://stream.radiojar.com/8s5u5tpdtwzuv -A "$A" 2>&1 | grep -iE '^(HTTP|location|content-type|icy|curl)' || true
          echo "=== radiojar station info"; curl -s --max-time 8 "https://www.radiojar.com/api/stations/8s5u5tpdtwzuv" | head -c 800; echo
          for p in https://www.maspero.eg/radio https://maspero.eg/radio https://www.maspero.eg/live-radio https://www.maspero.eg; do
            echo "=== $p"; curl -sL --max-time 10 "$p" -A "$A" | grep -oiE '(https?:)?//[^"'"'"' ]*(stream|radiojar|m3u8|mp3|aac|live|icecast)[^"'"'"' <]*' | sort -u | head -30
          done
          echo "=== maspero quran search"; curl -sL --max-time 10 https://www.maspero.eg -A "$A" | grep -oiE '[^"]{0,80}(القرآن|quran)[^"]{0,120}' | head -20
