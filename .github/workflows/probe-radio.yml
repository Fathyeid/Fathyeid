name: فحص روابط الإذاعة
on:
  push:
    branches: [dev]
    paths: [.github/workflows/probe-radio.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          curl -sL --max-time 10 "https://www.maspero.eg/stream/7" -A "$A" > /tmp/p
          grep -oiE '(src|file|source|data-[a-z-]+|url|stream)[=:][^>]{0,200}' /tmp/p | grep -viE '\.(png|jpe?g|gif|svg|css|woff2?)|google|facebook|twitter|fonts' | head -40
          echo ---; grep -oiE '<(audio|video|iframe|source)[^>]{0,300}' /tmp/p | head
