name: فحص روابط الإذاعة
on:
  push:
    branches: [dev]
    paths: [.github/workflows/probe-radio.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
          for u in https://n10.radiojar.com/0tpy1h0kxtzuv https://stream.radiojar.com/0tpy1h0kxtzuv.mp3 https://backup.qurango.net/radio/mishary_alafasi https://qurango.net/radio/mishary_alafasi https://server6.mp3quran.net/radio/mishary_alafasi https://backup.qurango.net/radio/mix https://qurango.net/radio/mix; do
            echo "=== $u"
            curl -sS -D - -o /tmp/b --max-time 5 -L "$u" -A "$A" 2>&1 | grep -iE '^(HTTP|location|content-type|curl)' || true
            head -c 8 /tmp/b | xxd | head -1; rm -f /tmp/b
          done
          echo "=== API sample"; curl -s "https://www.mp3quran.net/api/v3/radios?language=ar" | head -c 600
