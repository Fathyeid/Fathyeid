name: فحص سريع لتصنيفات IslamHouse
on:
  push:
    branches: [dev]
    paths: [.github/workflows/probe-ih.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          B='https://api3.islamhouse.com/v3/paV29H2gm56kvLPy'
          g=lambda u: json.load(urllib.request.urlopen(u, timeout=30))
          for typ in ['books','audios','videos']:
              d=g(f'{B}/main/get-category-items/795/{typ}/ar/ar/1/1/json')
              print(typ, 'total', d['links'].get('total_items'), 'pages', d['links'].get('pages_number'))
              it=d['data'][0]; full=g(it['api_url'])
              print(' item keys', list(full.keys()))
              for a in full.get('attachments', [])[:3]: print('  att', json.dumps(a, ensure_ascii=False)[:300])
          PY
          for u in https://d1.islamhouse.com/data/ar/ih_books/single2/ar-the-forty-family-hadiths.pdf; do
            echo "== $u"; curl -sI -H "Origin: https://localhost" "$u" | grep -iE 'HTTP|access-control|content-type|content-length|accept-ranges'
          done
