name: فحص سريع لتصنيفات IslamHouse
on:
  push:
    branches: [dev]
    paths: [.github/workflows/probe-ih.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, re
          B='https://api3.islamhouse.com/v3/paV29H2gm56kvLPy'
          def g(u):
              try: return json.load(urllib.request.urlopen(u, timeout=30))
              except Exception as e: return 'ERR '+str(e)[:60]
          top=g(B+'/categories/showall/ar/json')
          print('TOP', len(top))
          for c in top:
              if re.search('مسجد|مساجد|تاريخ|تراجم|علماء|الآخر|القيامة|البرزخ|الموت|الجنة|النار|الجنائز|السيرة|الصحابة|الغزوات|الحضارة|التفسير|الفقه|العقيدة|الحديث|التجويد|أصول|اللغة', c['title']): print(' ', c['id'], c['title'])
          for cid in [795, 34, 10]:
              d=g(f'{B}/categories/viewcat/{cid}/ar/showall/json'); print('VIEW', cid, json.dumps(d, ensure_ascii=False)[:500])
          for p in ['main/get-category-items/795/showall/ar/ar/1/2/json','main/get-category-items/795/books/ar/ar/1/2/json','categories/get-category-items/795/showall/ar/ar/1/2/json','main/get-category-items/795/ar/ar/1/2/json','categories/viewcat/795/ar/books/json','categories/viewcat/795/ar/showall/1/2/json']:
              print('P', p, json.dumps(g(B+'/'+p), ensure_ascii=False)[:400])
          PY
