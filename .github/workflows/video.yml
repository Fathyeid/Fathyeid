name: فيديو تعريفي بالتطبيق
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['scripts/video/**', '.github/workflows/video.yml']
permissions:
  contents: write
concurrency:
  group: athar-video
  cancel-in-progress: true
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: النسخة المنشورة من التطبيق (ما يراه الناس)
        uses: actions/checkout@v4
        with:
          ref: ccr-93877a35-woradx
          path: site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: الأدوات
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q "edge-tts>=6,<8"
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.47.2 && npx playwright install --with-deps chromium >/dev/null
      - name: التعليق الصوتي
        run: |
          mkdir -p out
          python3 scripts/video/build.py tts out
      - name: تسجيل الجولة
        run: |
          (cd site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          sleep 2
          NODE_PATH=/tmp/pw/node_modules node scripts/video/record.js http://localhost:8080/ "$PWD/out"
      - name: الدمج
        run: |
          python3 scripts/video/build.py mux out
          for t in 5 60 150 250 350 450 550; do ffmpeg -loglevel error -y -ss $t -i out/athar-video.mp4 -frames:v 1 -vf scale=240:-1 out/k$t.png || true; done
          ffmpeg -loglevel error -y $(for t in 5 60 150 250 350 450 550; do [ -f out/k$t.png ] && echo "-i out/k$t.png"; done) -filter_complex hstack=$(ls out/k*.png | wc -l) out/preview.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: athar-video
          path: |
            out/athar-video.mp4
            out/athar-video-720.mp4
            out/preview.png
      - name: النشر في صفحة الإصدارات (ما قبل الإصدار، لا يؤثر على رابط التطبيق)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: "فيديو تعريفي بتطبيق أثر (${{ github.run_number }})"
          body: |
            فيديو تعريفي بتطبيق «أثر — رفيق المسلم» (حوالي ١٠ دقائق): جولة في كل أقسام التطبيق المنشور بمظهر «أسمر» مع شرح صوتي بالعربية.
            athar-video.mp4 = الجودة العالية 1080×2340 • athar-video-720.mp4 = نسخة خفيفة للمشاركة على واتساب.
            التعليق الصوتي مولَّد آلياً (صوت عصبي عربي عبر edge-tts).
          files: |
            out/athar-video.mp4
            out/athar-video-720.mp4
            out/preview.png
          prerelease: true
          make_latest: false
      - name: معاينة للمراجعة (فرع media)
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin media || true
          mkdir -p /tmp/m && cp out/preview.png out/durations.json out/timeline.json /tmp/m/
          git checkout -q --orphan media-tmp && git rm -rq --cached . && git clean -fdq -e out
          cp /tmp/m/* . && git add preview.png durations.json timeline.json && git commit -qm "معاينة فيديو ${{ github.run_number }}"
          git push -q -f origin HEAD:media
