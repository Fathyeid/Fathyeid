<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>مشغّل أثر</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #p { position: absolute; inset: 0; width: 100%; height: 100%; }
    .msg { color: #fff; font-family: system-ui, sans-serif; display: grid; place-items: center; height: 100%; text-align: center; padding: 16px; }
  </style>
</head>
<body>
  <div id="p"></div>
  <script>
    // جسر بين التطبيق ومشغّل يوتيوب الرسمي (IFrame Player API)
    var q = new URLSearchParams(location.search);
    var vid = q.get('v'), list = q.get('list'), start = parseInt(q.get('t') || '0', 10) || 0, rate = parseFloat(q.get('r') || '1') || 1;
    var player, timer;
    function post(m) { try { parent.postMessage(Object.assign({ src: 'athar-yt' }, m), '*'); } catch (e) {} }
    window.onYouTubeIframeAPIReady = function () {
      var vars = { playsinline: 1, rel: 0, modestbranding: 1, start: start, hl: 'ar', origin: location.origin };
      if (list) { vars.listType = 'playlist'; vars.list = list; }
      player = new YT.Player('p', {
        host: 'https://www.youtube-nocookie.com',
        videoId: vid || undefined,
        playerVars: vars,
        events: {
          onReady: function () { try { player.setPlaybackRate(rate); } catch (e) {} post({ type: 'ready' }); },
          onStateChange: function (e) {
            post({ type: 'state', s: e.data, id: (player.getVideoData && player.getVideoData().video_id) || vid });
            clearInterval(timer);
            if (e.data === 1) timer = setInterval(function () { post({ type: 'time', t: player.getCurrentTime(), d: player.getDuration(), id: player.getVideoData().video_id }); }, 4000);
            if (e.data === 0 || e.data === 2) post({ type: 'time', t: player.getCurrentTime(), d: player.getDuration(), id: player.getVideoData().video_id });
          },
          onError: function (e) { post({ type: 'error', code: e.data }); }
        }
      });
    };
    window.addEventListener('message', function (e) {
      var m = e.data || {}; if (!player || m.dst !== 'athar-yt') return;
      try {
        if (m.cmd === 'rate') player.setPlaybackRate(m.v);
        if (m.cmd === 'seek') player.seekTo(m.v, true);
        if (m.cmd === 'pause') player.pauseVideo();
        if (m.cmd === 'play') player.playVideo();
      } catch (err) {}
    });
    var s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () { document.body.innerHTML = '<div class="msg">تعذّر تحميل المشغّل، تأكد من الاتصال بالإنترنت.</div>'; };
    document.head.appendChild(s);
  </script>
</body>
</html>
